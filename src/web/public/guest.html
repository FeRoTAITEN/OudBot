<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f0d0b">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex">
  <title>Oud · استماع</title>
  <link rel="icon" href="/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/guest.css">
</head>
<body>
  <main class="g-wrap">
    <div class="g-card">
      <img class="g-logo" src="/logo.svg" alt="">
      <h1 id="g-title">Oud</h1>
      <div id="g-sub" class="g-muted"></div>
      <select id="g-room" class="g-sel" hidden></select>
      <button id="g-btn" class="g-btn" type="button"></button>
      <div id="g-status" class="g-status" aria-live="polite"></div>
      <div class="g-eq" id="g-eq" hidden><i></i><i></i><i></i></div>
      <section id="g-people" class="g-people" hidden></section>
    </div>
    <p class="g-foot g-muted" id="g-foot"></p>
  </main>
  <script src="/guest.js"></script>
</body>
</html>
